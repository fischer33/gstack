services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: designhub, POSTGRES_PASSWORD: designhub, POSTGRES_DB: designhub }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  # S3-kompatibel; ersetzt minio/minio (Image nicht mehr frei ziehbar)
  s3:
    image: rustfs/rustfs:latest
    command: /data
    environment: { RUSTFS_ACCESS_KEY: designhub, RUSTFS_SECRET_KEY: designhub-secret, RUSTFS_CONSOLE_ENABLE: "true" }
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
volumes: { dbdata: {}, s3data: {} }
